name: Verzel QA CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      BASE_URL: https://verzel-store.qa-test-verzel-store.workers.dev

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps

      - name: Executar testes de API
        run: npm run test:api

      - name: Executar testes de UI
        run: npm run test:ui

      - name: Upload do relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn

      - name: Upload dos arquivos de resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: warn